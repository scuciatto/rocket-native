# Local Rocket.Chat for SDK integration testing.
#
#   cd IntegrationTests && docker compose up -d              # default: 8.6.0
#   RC_VERSION=7.0.0 MONGO_VERSION=6.0 docker compose up -d  # test another version
#   (RC 8.x officially requires MongoDB 8.0; RC 7.x supports MongoDB 5.0-7.0)
#   # wait ~1-2 min for first boot, then:
#   swift run rc-cli login http://localhost:3000 admin   # password: rc-admin-pass
#
# The setup wizard is pre-completed and an admin user is seeded via env vars.

services:
  rocketchat:
    image: registry.rocket.chat/rocketchat/rocket.chat:${RC_VERSION:-8.6.0}
    restart: unless-stopped
    environment:
      MONGO_URL: mongodb://mongodb:27017/rocketchat?replicaSet=rs0
      MONGO_OPLOG_URL: mongodb://mongodb:27017/local?replicaSet=rs0
      ROOT_URL: http://localhost:3000
      PORT: "3000"
      DEPLOY_METHOD: docker
      ADMIN_USERNAME: admin
      ADMIN_PASS: rc-admin-pass
      ADMIN_EMAIL: admin@example.com
      OVERWRITE_SETTING_Show_Setup_Wizard: completed
      # Keep registration open so tests can create secondary users.
      OVERWRITE_SETTING_Accounts_RegistrationForm: Public
    ports:
      - "3000:3000"
    depends_on:
      mongodb:
        condition: service_healthy

  mongodb:
    image: mongo:${MONGO_VERSION:-8.0}
    restart: unless-stopped
    command: mongod --replSet rs0 --oplogSize 128
    healthcheck:
      # Initiates the single-node replica set on first check, reports
      # healthy once it is up.
      test: >
        mongosh --quiet --eval
        "try { rs.status().ok } catch (e) {
           rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'mongodb:27017'}]}).ok
         }" | grep -q 1
      interval: 10s
      timeout: 10s
      retries: 10
